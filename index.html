<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saltenería El Horno</title>
</head>

<body>

    <header>
        <h1>Saltenería El Horno</h1>
    </header>

    <p>Preparamos deliciosas salteñas para disfrutar
        en familia y con amigos.</p>

    <form id="form-horno"
          novalidate
          method="POST"
          action="procesar.php">

        <label for="nombre">Nombre completo:</label>
        <input type="text"
               id="nombre"
               name="nombre"
               required>

        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email"
               id="correo"
               name="correo"
               required>

        <br><br>

        <label for="pedido">¿Qué salteñas querés?</label>
        <textarea id="pedido"
                  name="pedido"></textarea>

        <br><br>

        <button type="submit">Hacer mi pedido</button>

        <p id="aviso-horno" class="aviso"></p>

    </form>

    <footer>
        <p>Parcial 2 - TU NOMBRE COMPLETO - 20 de octubre de 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
